name: Node.js CI/CD to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-cicd-main
  cancel-in-progress: false

jobs:
  build-test-deploy:
    name: Test, build, and deploy to EC2
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
      EC2_READY: ${{ secrets.EC2_HOST != '' && secrets.EC2_USER != '' && secrets.EC2_SSH_KEY_B64 != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Verify build output
        run: test -s dist/index.html

      - name: Start the app and PostgreSQL for integration checks
        run: docker compose up --build -d

      - name: Verify the app is connected to PostgreSQL
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=100 app db
          exit 1

      - name: Stop integration services
        if: always()
        run: docker compose down -v

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nodeapp-build
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Prepare EC2 SSH key
        if: env.EC2_READY == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          printf '%s' "$EC2_SSH_KEY_B64" | base64 --decode > "$RUNNER_TEMP/ec2-key.pem"
          chmod 600 "$RUNNER_TEMP/ec2-key.pem"

      - name: Copy project to EC2
        if: env.EC2_READY == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Set EC2_HOST in repository secrets}"
          : "${EC2_USER:?Set EC2_USER in repository secrets}"
          rsync -az --delete --exclude='.git/' --exclude='node_modules/' --exclude='dist/' --exclude='.env' -e "ssh -i $RUNNER_TEMP/ec2-key.pem -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20" ./ "$EC2_USER@$EC2_HOST:nodeapp/"

      - name: Start the application on EC2
        if: env.EC2_READY == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ec2-key.pem" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1 || ! sudo docker compose version >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl openssl
            curl -fsSL https://get.docker.com | sudo sh
          fi
          sudo systemctl enable --now docker
          cd "$HOME/nodeapp"

          if [ ! -s .env ]; then
            postgres_password="$(openssl rand -hex 32)"
            umask 077
            cat > .env <<EOF
          POSTGRES_DB=nodeapp
          POSTGRES_USER=nodeapp
          POSTGRES_PASSWORD=$postgres_password
          EOF
          fi

          sudo docker compose up -d --build --remove-orphans
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              echo
              echo 'EC2 application and PostgreSQL health check passed.'
              exit 0
            fi
            sleep 2
          done
          sudo docker compose ps
          sudo docker compose logs --tail=100 app db
          exit 1
          REMOTE

      - name: Report that EC2 deployment is not configured
        if: github.ref == 'refs/heads/main' && env.EC2_READY != 'true'
        run: echo '::warning::CI and build passed, but EC2 deployment was skipped. Add EC2_HOST, EC2_USER, and EC2_SSH_KEY_B64 repository secrets.'

      - name: Remove temporary SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/ec2-key.pem"
