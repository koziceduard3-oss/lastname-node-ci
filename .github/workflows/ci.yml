name: Node.js CI for Render and Supabase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and integration check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Verify build output
        run: test -s dist/index.html

      - name: Start the app and PostgreSQL for integration checks
        run: docker compose up --build -d

      - name: Verify the app is connected to PostgreSQL
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=100 app db
          exit 1

      - name: Stop integration services
        if: always()
        run: docker compose down -v

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nodeapp-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
